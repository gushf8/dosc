<text x="192.0" y="748.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="650" fill="#1F2933" opacity="1.00">Multi-Criteria Optimization Loss L(G)</text>
<text x="192.0" y="790.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="4.3" font-weight="400" fill="#1F2933" opacity="0.68">L(G) = D_dist(G) + D_dep(G) + D_eiv(G) + (1 - S_temp(G)) + Pen(G)</text></g>
<g id="node-feasibility_check"><rect x="57.0" y="848.0" width="270.0" height="90.0" rx="3" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.25"/>
