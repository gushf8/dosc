<text x="192.0" y="610.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="650" fill="#1F2933" opacity="1.00">Kish Effective Sample Size &amp; Intra-Cell Dispersion</text>
<text x="192.0" y="652.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="4.3" font-weight="400" fill="#1F2933" opacity="0.68">n_eff = (Sum w_it p_igt)^2 / Sum (w_it p_igt)^2 | var_Y_intra, var_X_intra</text></g>
<g id="node-multi_loss_tradeoff"><rect x="57.0" y="710.0" width="270.0" height="90.0" rx="3" fill="#FFFFFF" stroke="#2F3B45" stroke-width="1.25"/>
