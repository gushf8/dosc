<text x="192.0" y="1068.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="4.3" font-weight="400" fill="#1F2933" opacity="0.68">Optimal Cohort Cardinality G* (Zero Ad-Hoc 5-Year Bins)</text></g>
