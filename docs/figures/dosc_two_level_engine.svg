<text x="173.1" y="459.3" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="650" fill="#1F2933" opacity="1.00">Soft Weights</text>
<text x="173.1" y="493.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="4.3" font-weight="400" fill="#1F2933" opacity="0.68">p_igt = exp(-d_M^2(Z_it, mu_g) / 2gamma) / Sum_j</text></g>
