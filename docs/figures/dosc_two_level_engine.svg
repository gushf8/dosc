<text x="192.0" y="886.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5.5" font-weight="650" fill="#1F2933" opacity="1.00">Feasibility Region Evaluation (F)</text>
<text x="192.0" y="928.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="4.3" font-weight="400" fill="#1F2933" opacity="0.68">D_dist &lt;= tau_d ^ D_dep &lt;= tau_c ^ D_eiv &lt;= tau_eiv ^ S_temp &gt;= tau_s ^ n_eff &gt;= n_min</text></g>
